# Stack backend Mbolo TV (auto-hébergé, essai)
# Build context = racine du monorepo ; le Dockerfile de apps/api build api + worker.
# Exposition publique : tunnel Cloudflare nommé (service "cloudflared", réseau Compose par défaut).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ./docker.env
    # Bindé en local uniquement (diagnostic) ; le trafic public passe par cloudflared.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/worker/dist/main.js"]
    env_file: ./docker.env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    # Tag pinné (vérifié sur Docker Hub) ; ne pas utiliser :latest.
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--no-autoupdate", "run"]
    volumes:
      - ./cloudflared-data:/etc/cloudflared:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
