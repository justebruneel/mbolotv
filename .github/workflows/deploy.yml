name: Deploy API (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'fly.toml'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Déployer l'API (build distant, aucun Docker local requis)
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
