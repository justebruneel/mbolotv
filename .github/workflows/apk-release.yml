name: APK Android (mobile + TV)

# Build des deux enveloppes natives et attachement à une Release GitHub.
# Déclenché par un tag v* (ex. v1.0.0) ou manuellement via l'UI Actions.
#
# Signature : secrets requis (Settings → Secrets and variables → Actions) —
#   ANDROID_KEYSTORE          : base64 du fichier .jks (cat mbolo-release.jks | base64 -w0)
#   ANDROID_KEYSTORE_PASSWORD : mot de passe du keystore
#   ANDROID_KEY_ALIAS         : alias (mbolo)
#   ANDROID_KEY_PASSWORD      : mot de passe de la clé (identique au store)
# Sans secrets, la release est créée mais les APK ne sont PAS signés
# (non installables) : un warning l'indique pendant le build.
#
# NB : les contextes `secrets`/`env` ne sont PAS utilisés dans des `if:`
# (validation GitHub stricte) — les gardes sont faites en bash dans les run:.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurer le keystore (secrets)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            mkdir -p "$HOME/keys"
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > "$HOME/keys/mbolo-release.jks"
            {
              echo "MBOLO_KEYSTORE=$HOME/keys/mbolo-release.jks"
              echo "MBOLO_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "MBOLO_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "MBOLO_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE absent — les APK seront NON signés (non installables)."
          fi

      - name: Build APK mobile
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          (cd android && ./gradlew assembleRelease --no-daemon)

      - name: Build APK Android TV
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-tv/local.properties
          (cd android-tv && ./gradlew assembleArm64Release assembleArm32Release --no-daemon)

      - name: Renommer les APK (noms stables pour releases/latest/download)
        run: |
          # Noms sans version : les liens du site restent valables à jamais.
          cp android/app/build/outputs/apk/release/app-release*.apk mbolo-tv-android.apk
          cp android-tv/app/build/outputs/apk/arm64/release/app-arm64-release*.apk mbolo-tv-android-tv-arm64.apk
          cp android-tv/app/build/outputs/apk/arm32/release/app-arm32-release*.apk mbolo-tv-android-tv-arm32.apk
          ls -la mbolo-tv-android*.apk

      - name: Vérifier la signature
        run: |
          keytool -printcert -jarfile mbolo-tv-android.apk 2>/dev/null | grep -E "CN=|Valid from" | head -3 \
            || echo "::warning::APK non signé (secrets absents)."

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Mbolo TV Apps ${{ github.ref_name }}"
          body: |
            Enveloppes natives de Mbolo TV.
            - `mbolo-tv-android.apk` — téléphones Android 6+
            - `mbolo-tv-android-tv-arm64.apk` — box Android TV récentes (arm64)
            - `mbolo-tv-android-tv-arm32.apk` — vieilles box AOSP (arm32, avec moteur Gecko embarqué)
          files: mbolo-tv-android*.apk
          fail_on_unmatched_files: false
