name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # Les workers sont hors workspace pnpm (npm à part) : le test du
          # Worker importe @mbolo/contracts depuis son node_modules.
          (cd workers/mbolo-tv-api && npm ci)
          # dist/ est gitignoré : le file: du worker pointe sur le dossier
          # source, il faut construire le JS de @mbolo/contracts avant le test.
          pnpm --filter @mbolo/contracts build

      # Le client généré peut être périmé dans le cache pnpm : régénération
      # explicite avant typecheck/test/build (le client vit dans packages/db).
      - name: Generate Prisma client
        run: pnpm --filter @mbolo/db exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Validate Cloudflare workers
        # Exclure node_modules : après `npm ci`, le find capturait les .worker.js
        # de miniflare (syntaxe `using` runtime-supported, pas du JS Node) → 123.
        run: |
          find workers -path '*/src/*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
