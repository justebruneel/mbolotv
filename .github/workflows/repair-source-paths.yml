name: Repair source paths

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repair-source-paths]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch worker routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('workers/mbolo-tv-api/src/owner-routes.js')
          s = p.read_text()
          if "from './source-test.js'" not in s:
              s = s.replace("import * as notifications from './notifications.js';", "import * as notifications from './notifications.js';\nimport { testSourceConnection } from './source-test.js';")
          pattern = re.compile(r"  if \(sourceDetail && sourceDetail\[3\] === 'test' && method === 'GET'\) \{.*?\n  \}\n  if \(sourceDetail && sourceDetail\[3\] === 'credentials'", re.S)
          replacement = '''  if (sourceDetail && sourceDetail[3] === 'test' && method === 'GET') {
    const source = await findOwnedSource(ctx, owner, sourceDetail[1]);
    if (!source) return ctx.fail(404, 'Source introuvable');
    try {
      const key = await importKey(env.ENCRYPTION_KEY);
      const connection = JSON.parse(await decryptLocator(key, source.connectionEncrypted));
      return ctx.json(await testSourceConnection(env, source.kind, connection));
    } catch (error) {
      return ctx.json({ ok: false, latencyMs: null, error: String(error?.message ?? error).replace(/https?:\\/\\/[^\\s]+/g, '[url masquée]').slice(0, 300) });
    }
  }
  if (sourceDetail && sourceDetail[3] === 'credentials' '''
          if not pattern.search(s):
              raise SystemExit('source test block not found')
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)
          PY
      - name: Increase VOD response ceiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('workers/mbolo-tv-api/src/xtream.js')
          s = p.read_text()
          old = "const MAX_API_BYTES = 50 * 1024 * 1024;"
          new = "const MAX_API_BYTES = 200 * 1024 * 1024;"
          if old not in s:
              raise SystemExit('Xtream byte ceiling not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate JavaScript
        run: |
          node --check workers/mbolo-tv-api/src/source-test.js
          node --check workers/mbolo-tv-api/src/owner-routes.js
          node --check workers/mbolo-tv-api/src/xtream.js
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MboloTV CI"
          git config user.email "actions@users.noreply.github.com"
          git add workers/mbolo-tv-api/src/source-test.js workers/mbolo-tv-api/src/owner-routes.js workers/mbolo-tv-api/src/xtream.js
          git commit -m "fix(source): unify connection tests and support large VOD catalogs"
          git push origin HEAD:main
