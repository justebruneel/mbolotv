name = "mbolo-tv-video-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Sortie résidentielle (tunnel cloudflared local) pour les fournisseurs qui
# bloquent les IP datacenter. Clé = host:port du fournisseur, valeur = origine
# du relais. Retirer une entrée si la machine locale est mise hors service.
# Backends vippyddncr.top découverts par sondage des redirections (relay-m01…m13).
# dnsjibre.xyz (panel + serveurs médias) bloque les IP datacenter : tout passe
# par relay-dns, dont le forwarder local route via « x-upstream-authority ».
# RELAY_DOMAIN_MAP relaie les domaines entiers (les serveurs médias evorvixa.cc
# sont numérotés et changent sans prévenir).
# RELAY_DEFAULT_ORIGIN : tout hôte de fournisseur NON cartographié ci-dessus
# sort automatiquement par le forwarder générique relay-dns (x-upstream-authority
# + x-relay-token) — rien à configurer lors de l'import d'une nouvelle playlist.
[vars]
RELAY_DEFAULT_ORIGIN = "https://relay-dns.mbolotv.dpdns.org"
RELAY_DOMAIN_MAP = '{"evorvixa.cc":"https://relay-dns.mbolotv.dpdns.org","dnsjibre.xyz":"https://relay-dns.mbolotv.dpdns.org"}'
