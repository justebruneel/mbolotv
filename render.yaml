services:
  - type: web
    name: mbolo-tv-api
    runtime: docker
    repo: https://github.com/justebruneel/mbolotv
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_CONSOLE_PATH
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_MODE
        value: permissive
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: mbolo-tv
      - key: IMPORT_LOGO_MAX_DOWNLOADS
        value: "250"
      - key: IMPORT_LOGO_TIMEOUT_MS
        value: "2500"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_LOGO_URL_TTL_SECONDS
        sync: false
      - key: API_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
